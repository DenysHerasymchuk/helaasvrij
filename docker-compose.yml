services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: coach
      POSTGRES_USER: coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coach -d coach"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    # Apply migrations, then start the API.
    entrypoint: ["sh", "-c", "dotnet InternshipCoach.Api.dll --migrate && exec dotnet InternshipCoach.Api.dll"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jobs-data:/home/app
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      COACH_ConnectionStrings__InternshipCoach: Host=db;Port=5432;Database=coach;Username=coach;Password=${POSTGRES_PASSWORD}
      COACH_Cors__AllowedOrigins__0: http://localhost:5173
      COACH_Hosting__HttpsTerminatedAtProxy: "true"
      COACH_GitHub__ClientId: ${GITHUB_CLIENT_ID:-}
      COACH_Adzuna__AppId: ${ADZUNA_APP_ID:-}
      COACH_Adzuna__AppKey: ${ADZUNA_APP_KEY:-}
      COACH_GitHub__ClientSecret: ${GITHUB_CLIENT_SECRET:-}
      COACH_Route33__ApiKey: ${R33_API_KEY:-}
      COACH_GitHub__Token: ${GITHUB_TOKEN:-}
      # AI fallback: when route33 fails, run the Claude Code CLI inside this container (log in once: docker compose exec api claude; the login lives in the jobs-data volume).
      COACH_Llm__Fallback: ${LLM_FALLBACK:-}
      COACH_Llm__ClaudeCli__Mode: Local
      COACH_Llm__ClaudeCli__BridgeUrl: ${CLAUDE_BRIDGE_URL:-http://host.docker.internal:8787}
      COACH_Llm__ClaudeCli__Token: ${CLAUDE_BRIDGE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5080:8080"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  jobs-data:
  db-data:
